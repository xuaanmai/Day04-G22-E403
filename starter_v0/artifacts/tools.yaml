tools:
  - name: clarify
    description: "Hỏi lại đúng một thông tin bắt buộc còn thiếu, hoặc xin xác nhận yes/no trước hành động có side effect. Không dùng khi có thể trả lời trực tiếp."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Câu hỏi ngắn, nêu rõ thông tin cần bổ sung hoặc hành động cần xác nhận."}
        response_type: {type: string, enum: [text, yes_no, choice], default: text, description: "Dùng yes_no trước hành động gửi/đăng; text cho URL, tài khoản hoặc thông tin còn thiếu."}
        options: {type: array, items: {type: string}, default: [], description: "Chỉ điền khi response_type=choice."}
      required: [question, response_type]

  - name: timeline
    description: "Lấy bài đăng gần đây của MỘT tài khoản Twitter/X cụ thể. Cần screenname không có @. Không dùng để tìm bài theo chủ đề từ nhiều tài khoản; khi thiếu tài khoản hãy dùng clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, description: "Handle không có @, ví dụ sama, elonmusk, karpathy."}
        limit: {type: integer, minimum: 1, maximum: 20, default: 5, description: "Số bài; giữ đúng số người dùng yêu cầu."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng Twitter/X theo từ khóa hoặc chủ đề từ nhiều tài khoản. Không dùng khi yêu cầu bài của một tài khoản cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa/chủ đề ngắn gọn."}
        search_type: {type: string, enum: [Latest, Top], default: Latest, description: "Top cho phổ biến/top/nổi bật; Latest cho còn lại."}
        limit: {type: integer, minimum: 1, maximum: 20, default: 5, description: "Số kết quả."}
      required: [query]

  - name: lookup
    description: "Tìm nguồn trên web. Dùng news cho tin/sự kiện hiện tại và general cho tra cứu chung. Không dùng để đọc một URL đã có hoặc tìm tweet."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Chủ đề tìm kiếm ngắn, không tự thêm news/today nếu không cần."}
        topic: {type: string, enum: [general, news], default: general, description: "news cho tin tức hiện tại."}
        timeframe: {type: string, enum: [day, week, month, year], default: week, description: "hôm nay=day, tuần này=week, tháng này=month, năm nay=year."}
        max_results: {type: integer, minimum: 1, maximum: 10, default: 5, description: "Số kết quả."}
      required: [query]

  - name: fetch
    description: "Đọc và trích nội dung từ đúng một URL cụ thể đã có. Nếu người dùng nói 'bài này' nhưng chưa cung cấp URL, dùng clarify thay vì đoán."
    parameters:
      type: object
      properties:
        url: {type: string, description: "URL đầy đủ do người dùng cung cấp hoặc đã xuất hiện trong hội thoại."}
      required: [url]

  - name: format
    description: "Định dạng danh sách item ĐÃ CÓ thành digest Markdown. Không tìm kiếm dữ liệu và không gọi khi chưa có items."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Các item đã thu thập."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: sections, description: "Kiểu trình bày."}
        headline: {type: string, default: "", description: "Tiêu đề tùy chọn."}
      required: [items, template]

  - name: source_ranker
    description: "Xếp hạng danh sách nguồn ĐÃ CÓ theo heuristic uy tín, HTTPS, độ mới và relevance. Không tìm nguồn mới và không thay thế kiểm chứng nội dung."
    parameters:
      type: object
      properties:
        sources:
          type: array
          description: "Danh sách nguồn cần xếp hạng; mỗi nguồn nên có title, url và có thể có published_at, relevance_score."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              published_at: {type: string}
              relevance_score: {type: number}
        prefer_recent: {type: boolean, default: true, description: "Có cộng điểm cho nguồn mới hay không."}
      required: [sources]

  - name: send
    description: "Gửi text lên Telegram, có side effect. Chỉ gọi với confirmed=true sau khi người dùng đã xác nhận rõ; nếu chưa xác nhận phải dùng clarify yes_no."
    parameters:
      type: object
      properties:
        text: {type: string, description: "Nội dung đã được người dùng duyệt."}
        confirmed: {type: boolean, default: false, description: "Phải là true sau xác nhận rõ ràng."}
      required: [text, confirmed]

  - name: policy
    description: "Tìm quy định nội bộ trong company policy markdown. Không dùng cho tin tức, luật công cộng hiện tại hoặc nguồn web."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Nội dung quy định nội bộ cần tìm."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: all}
        top_k: {type: integer, minimum: 1, maximum: 5, default: 3}
      required: [query]

  - name: papers
    description: "Tìm metadata paper trên arXiv theo từ khóa. Không dùng cho tin tức web hoặc đọc toàn văn một paper cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa nghiên cứu."}
        max_results: {type: integer, minimum: 1, maximum: 10, default: 5}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: relevance}
      required: [query]

  - name: paper_text
    description: "Tải và trích text một paper arXiv cụ thể khi đã có arXiv URL hoặc ID."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, description: "arXiv URL hoặc ID cụ thể."}
        max_pages: {type: integer, minimum: 1, maximum: 20, default: 5}
        max_chars: {type: integer, minimum: 1000, maximum: 30000, default: 8000}
      required: [arxiv_url]
